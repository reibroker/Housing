name: Refresh data and deploy

# Fetches every source SERVER-SIDE and publishes the result straight to Pages.
#
# NOTHING IS COMMITTED. An earlier version committed the snapshot on every run,
# which worked but grew the repository by roughly 390 KB an hour -- about 1.2 GB
# a year of git history holding numbers that change monthly. On a 500 MB account
# budget that is the whole allowance in five months, spent on stale copies.
#
# The data belongs in the deployed artifact, not in version control: Pages serves
# the newest build and replaces the previous one, so the site is always current
# and the repository stays the size of its source. Git keeps code; Pages keeps
# data. The diagnostic report is published alongside the site for the same reason.
#
# Why this workflow deploys rather than letting pages.yml do it: GitHub does not
# trigger workflows from actions taken with the built-in GITHUB_TOKEN, so nothing
# this job did could ever have started another workflow.

on:
  schedule:
    # Hourly. US statistical releases land at 08:30 ET; a new figure is live
    # within the hour, allowing for scheduler drift and the build.
    - cron: '25 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-data.mjs'
      - '.github/workflows/data.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fetch all sources
        id: fetch
        env:
          # Optional. Census gaps fall back to keyless FRED mirrors, so the
          # dashboard is complete without this; a key promotes those panels to
          # the primary source and activates their cross-checks.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          HISTORY_YEARS: '12'
        run: node scripts/fetch-data.mjs

      - name: Skip the rebuild if no figure actually changed
        id: changed
        run: |
          # Compare against what is already live. The data moves monthly, so most
          # hourly runs have nothing new to publish and should stop here.
          LIVE=$(curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/manifest.json" 2>/dev/null \
                 | python3 -c "import sys,json;print(json.load(sys.stdin).get('contentHash',''))" 2>/dev/null || echo "")
          NEW="${{ steps.fetch.outputs.content_hash }}"
          echo "live=$LIVE new=$NEW"
          if [ -n "$LIVE" ] && [ "$LIVE" = "$NEW" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change since the deployed snapshot — skipping deploy."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Summarize
        run: |
          echo '### Data refresh' >> $GITHUB_STEP_SUMMARY
          echo "Changed: ${{ steps.changed.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat public/data/manifest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build
        if: steps.changed.outputs.changed == 'true'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEFAULT_DEMO: 'false'
        run: npm run build

      - name: Add SPA + no-Jekyll files
        if: steps.changed.outputs.changed == 'true'
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.changed == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.changed.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
