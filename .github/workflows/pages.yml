name: Deploy to GitHub Pages

# Publishes the static build to GitHub Pages so the dashboard is reachable from
# any device -- phone, tablet, someone else's laptop -- without a local install.
#
# The deployed build opens on the PUBLISHED SNAPSHOT: real data, fetched
# server-side by data.yml and served from this site's own origin, so it needs no
# API key and no CORS cooperation from the upstreams. Demo mode remains available
# from the Data selector for offline or UI work.
#
# No manual setup needed: the build job calls actions/configure-pages with
# enablement, which switches Pages on using this workflow's own pages:write
# grant. (If your org policy blocks that, set it by hand once at
# Settings -> Pages -> Source: "GitHub Actions".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Turns Pages on for the repo if it is not already, using this workflow's
      # own `pages: write` grant. Without it the deploy job fails on a fresh repo
      # until someone flips Settings -> Pages -> Source by hand.
      # Tries to switch Pages on using this workflow's own pages:write grant.
      # Some account configurations do not allow a workflow token to create the
      # Pages site, so this must never fail the build -- if it cannot enable
      # Pages, the build still runs and uploads its artifact, and the deploy
      # succeeds as soon as Pages is turned on at
      # Settings -> Pages -> Source: "GitHub Actions".
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build for Pages
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # A published snapshot now ships with the site, so the default mode is
          # the real data rather than the synthetic placeholder.
          VITE_DEFAULT_DEMO: 'false'
        run: npm run build

      - name: Add SPA + no-Jekyll files
        run: |
          # Pages would otherwise strip files/directories beginning with an underscore.
          touch dist/.nojekyll
          # Single-page app: any deep link should fall back to index.html.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
