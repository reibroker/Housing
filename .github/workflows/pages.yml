name: Deploy to GitHub Pages

# Publishes the static build to GitHub Pages so the dashboard is reachable from
# any device -- phone, tablet, someone else's laptop -- without a local install.
#
# The deployed build opens in DEMO mode (VITE_DEFAULT_DEMO=true) because a public
# build has no API key and, on a static host, several upstreams will be blocked by
# CORS anyway. Demo mode is loudly labelled as synthetic in the UI. Visitors who
# want live data can paste their own Census key into the Settings tab and switch
# the Data selector to "Live APIs" -- their key stays in their own browser and is
# never part of this build.
#
# ONE-TIME SETUP: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build for Pages
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEFAULT_DEMO: 'true'
        run: npm run build

      - name: Add SPA + no-Jekyll files
        run: |
          # Pages would otherwise strip files/directories beginning with an underscore.
          touch dist/.nojekyll
          # Single-page app: any deep link should fall back to index.html.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
