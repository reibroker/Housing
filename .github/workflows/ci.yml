name: CI

# Build and end-to-end test on every push and pull request. The smoke test runs
# the built app in headless Chromium with all four upstream APIs intercepted, so
# CI never touches a real API, needs no secrets, and cannot be broken by a
# provider outage or a spent rate limit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node scripts/smoke-test.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
          retention-days: 7
